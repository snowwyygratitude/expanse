<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#1b2550" />
  <title>Expanse: The Emotion Garden</title>
</head>
<body>
  <canvas id="garden" aria-label="Your garden. Drag an emotion seed from the ledge at the bottom into the ground and the world transforms."></canvas>
  <div id="mark" aria-hidden="true">expanse</div>
  <div id="caption" aria-live="polite"><div class="fresh">a new sky found</div><h1></h1><p></p></div>
  <form id="whisper" autocomplete="off" hidden>
    <p class="q" hidden></p>
    <div class="chips" hidden></div>
    <textarea rows="1" aria-label="Your words"></textarea>
    <div class="row"><button type="submit" class="go"></button><button type="button" class="no">never mind</button></div>
    <small></small>
  </form>
  <div id="stone" role="dialog" aria-label="Set down a worry" hidden>
    <div class="dim"></div>
    <button type="button" class="x" aria-label="Close">✕</button>
    <div class="panel">
      <p class="q" hidden></p>
      <div class="starters" aria-label="Start with"></div>
      <div class="rock"><svg class="spiral" viewBox="-50 -50 100 100" aria-hidden="true"><path /></svg><textarea rows="1" maxlength="400" placeholder="what is weighing on you?" aria-label="What is weighing on you"></textarea></div>
      <button type="button" class="down" disabled></button>
      <button type="button" class="skip" hidden></button>
      <small></small>
    </div>
  </div>
  <nav id="a11y" aria-label="Garden controls"></nav>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
